name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK (ANDROID_HOME); make sure the two pieces the dex build needs are there
      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Build routing helper (AppRoute.java -> approute.dex)
        run: sh route/build_dex.sh

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      # Two flavors from one code base: fdroid (Shizuku only, all features free) and play (built-in ADB, no Shizuku needed).
      - name: Unit tests
        run: gradle --no-daemon --console=plain testFdroidDebugUnitTest testPlayDebugUnitTest

      # CI builds the debug APKs of both flavors and an unsigned fdroid release APK. Releases only carry the release APK signed with
      # the developer's key on the developer's own machine (the key never goes to CI), uploaded by hand.
      - name: Build debug APKs
        run: gradle --no-daemon --console=plain assembleFdroidDebug assemblePlayDebug

      - uses: actions/upload-artifact@v4
        with:
          name: splitaudio-fdroid-debug-apk
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: splitaudio-play-debug-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk

      - name: Build fdroid release APK (unsigned; signed later on the developer's machine)
        run: gradle --no-daemon --console=plain assembleFdroidRelease

      - uses: actions/upload-artifact@v4
        with:
          name: splitaudio-fdroid-release-unsigned
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
